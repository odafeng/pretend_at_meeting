[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conference-to-briefing"
version = "0.1.0"
description = "Turn recorded conference sessions into source-grounded summaries and briefing decks"
readme = "README.en.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "natsort>=8.0.0",
    "python-pptx>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
conference-to-briefing = "pretend_at_meeting:main"

[tool.setuptools]
py-modules = ["pretend_at_meeting"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
